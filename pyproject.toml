[project]
name = "loewen-menu-mcp"
version = "0.1.0"
description = "MCP server for Löwen Menü IBS5 meal ordering system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx[socks]>=0.28.1",
    "lxml>=6.1.3",
    "mcp>=2.3.0",
]

[project.scripts]
loewen-menu-mcp = "server:mcp.run"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
